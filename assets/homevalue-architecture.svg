<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">HomeValue application architecture</title>
<desc id="desc">Four connected stages: user form, Streamlit app, saved scikit-learn pipeline, and prediction result.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0F766E"/></marker>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity=".08"/></filter>
</defs>
<rect x="1" y="1" width="1198" height="388" rx="24" fill="#FFFFFF" stroke="#DCE7E8"/>
<text x="42" y="46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.2" fill="#0F766E">INFERENCE ARCHITECTURE</text>
<text x="42" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#102A43">From user input to model output</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#soft)">
 <rect x="38" y="115" width="245" height="190" rx="18" fill="url(#panel)" stroke="#B7DAD3"/>
 <rect x="325" y="115" width="245" height="190" rx="18" fill="url(#panel)" stroke="#B7DAD3"/>
 <rect x="612" y="115" width="245" height="190" rx="18" fill="url(#panel)" stroke="#B7DAD3"/>
 <rect x="899" y="115" width="263" height="190" rx="18" fill="url(#panel)" stroke="#B7DAD3"/>
</g>
<g stroke="#0F766E" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M285 210H315"/><path d="M572 210H602"/><path d="M859 210H889"/></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
 <g fill="#0F766E"><circle cx="160" cy="153" r="17" fill="#D1FAE5"/><circle cx="447" cy="153" r="17" fill="#D1FAE5"/><circle cx="734" cy="153" r="17" fill="#D1FAE5"/><circle cx="1030" cy="153" r="17" fill="#D1FAE5"/></g>
 <g font-size="14" font-weight="800" fill="#0F766E"><text x="160" y="158">01</text><text x="447" y="158">02</text><text x="734" y="158">03</text><text x="1030" y="158">04</text></g>
 <g font-size="19" font-weight="750" fill="#102A43"><text x="160" y="196">User form</text><text x="447" y="196">Streamlit app</text><text x="734" y="196">Saved ML pipeline</text><text x="1030" y="196">Prediction</text></g>
 <g font-size="13" fill="#526777"><text x="160" y="226"><tspan x="160">Collect 13 feature</tspan><tspan x="160" dy="19">values from the user</tspan></text><text x="447" y="226"><tspan x="447">Build a Pandas</tspan><tspan x="447" dy="19">DataFrame</tspan></text><text x="734" y="226"><tspan x="734">Imputation + Random</tspan><tspan x="734" dy="19">Forest regression</tspan></text><text x="1030" y="226"><tspan x="1030">Format and display</tspan><tspan x="1030" dy="19">the estimated target</tspan></text></g>
 <g font-size="11" font-weight="700" fill="#0F766E"><text x="160" y="282">INPUT</text><text x="447" y="282">PREPARE</text><text x="734" y="282">INFER</text><text x="1030" y="282">DISPLAY</text></g>
</g>
<text x="42" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#64748B">Training is a separate workflow: dataset → train/test split → fit pipeline → evaluate → save model artifact.</text>
</svg>